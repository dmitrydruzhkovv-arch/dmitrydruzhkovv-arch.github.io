<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Репетитор Ди · математика</title>
<meta name="description" content="Расписание уроков и материалы для подготовки к экзаменам по математике">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-text-size-adjust: 100%; }
  body {
    background: #e6e6fa;
    font-family: -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif;
    color: #2b2b2b;
    line-height: 1.5;
    padding: 24px 16px 40px;
    min-height: 100vh;
  }
  .page { max-width: 760px; margin: 0 auto; }

  header { margin-bottom: 28px; text-align: center; }
  .title-pill {
    display: inline-block;
    font-size: 26px; font-weight: 900; color: #111;
    background: #FFDC4B; padding: 8px 20px; border-radius: 4px;
    letter-spacing: -0.3px;
    margin-bottom: 12px;
  }
  .subtitle {
    font-size: 14px; color: #555;
    text-transform: uppercase; letter-spacing: 0.6px;
    font-weight: 700;
  }

  .cards {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
    margin-bottom: 32px;
  }

  .card {
    display: flex;
    align-items: center;
    gap: 16px;
    background: #fff;
    border: 1.5px solid #cccce8;
    border-left: 4px solid #FFDC4B;
    border-radius: 12px;
    padding: 18px 20px;
    text-decoration: none;
    color: inherit;
    transition: transform 0.1s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .card:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(43, 43, 43, 0.10);
    border-left-color: #f5c800;
  }
  .card:active { transform: translateY(0); }

  .card-icon {
    width: 48px; height: 48px;
    flex-shrink: 0;
    background: #FFDC4B;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 900;
    color: #2b2b2b;
    font-family: Cambria, Georgia, serif;
  }
  .card-body { flex: 1; min-width: 0; }
  .card-title { font-size: 18px; font-weight: 800; color: #2b2b2b; margin-bottom: 4px; }
  .card-desc { font-size: 13px; color: #666; line-height: 1.5; }
  .card-arrow { font-size: 22px; color: #888; flex-shrink: 0; }

  .section-title {
    font-size: 12px; font-weight: 800;
    color: #555; text-transform: uppercase; letter-spacing: 0.6px;
    margin: 28px 0 12px; padding: 0 4px;
  }

  footer {
    margin-top: 40px;
    text-align: center;
    font-size: 12px;
    color: #888;
    line-height: 1.7;
  }
  footer a { color: #555; text-decoration: none; border-bottom: 1px dotted #aaa; }

  @media (max-width: 600px) {
    body { padding: 16px 12px 32px; }
    .title-pill { font-size: 20px; padding: 6px 14px; }
    .subtitle { font-size: 12px; }
    .card { padding: 14px 16px; gap: 12px; }
    .card-icon { width: 40px; height: 40px; font-size: 20px; }
    .card-title { font-size: 16px; }
    .card-desc { font-size: 12px; }
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="title-pill">Репетитор Ди</div>
    <div class="subtitle">Математика · ОГЭ · ЕГЭ</div>
  </header>

  <div class="section-title">Этой недели</div>
  <div class="cards">
    <a href="/raspisanie/" class="card">
      <div class="card-icon">📅</div>
      <div class="card-body">
        <div class="card-title">Расписание</div>
        <div class="card-desc">Свободные слоты на запись · уроки на этой неделе</div>
      </div>
      <div class="card-arrow">→</div>
    </a>
  </div>

  <div class="section-title">Уроки и материалы</div>
  <div class="cards">
    <a href="/umnozhenie-desyatichnyh/" class="card">
      <div class="card-icon">×</div>
      <div class="card-body">
        <div class="card-title">Умножение десятичных дробей</div>
        <div class="card-desc">5 класс · Мерзляк §34 · 7 заданий с разбором</div>
      </div>
      <div class="card-arrow">→</div>
    </a>
  </div>

  <footer>
    Ди · репетитор по математике<br>
    Подготовка к ОГЭ и ЕГЭ
  </footer>

</div>
</body>
</html>
